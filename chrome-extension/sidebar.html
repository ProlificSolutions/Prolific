<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prolific AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div class="sidebar">

    <!-- Header -->
    <div class="header">
      <svg class="logo-icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L2 7l10 5 10-5-10-5Z" stroke="#c8ced8" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M2 17l10 5 10-5" stroke="#c8ced8" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M2 12l10 5 10-5" stroke="#c8ced8" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
      <div class="header-text">
        <h1>PROLIFIC AI</h1>
        <span>Meeting Assistant</span>
      </div>
      <button class="icon-btn" id="closeBtn" title="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <path d="M18 6L6 18M6 6l12 12" stroke="#c8ced8" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <!-- Tabs -->
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="ask"      role="tab">ASK</button>
      <button class="tab"        data-tab="notes"    role="tab">NOTES</button>
      <button class="tab"        data-tab="summary"  role="tab">SUMMARY</button>
      <button class="tab"        data-tab="settings" role="tab">SETTINGS</button>
    </div>

    <!-- ── Ask Tab ── -->
    <div class="tab-panel active" id="tab-ask">
      <div class="qa-history" id="qaHistory"></div>
      <div class="input-area">
        <textarea id="questionInput" placeholder="Ask anything during the meeting… (Ctrl+Enter to send)" rows="3"></textarea>
        <button class="btn-primary" id="askBtn">Ask Claude</button>
      </div>
    </div>

    <!-- ── Notes Tab ── -->
    <div class="tab-panel" id="tab-notes">
      <div class="notes-list" id="notesList">
        <div class="empty-hint">Notes you save will appear here with timestamps.</div>
      </div>
      <div class="input-area">
        <textarea id="noteInput" placeholder="Type a note… (Ctrl+Enter to save)" rows="3"></textarea>
        <button class="btn-secondary" id="saveNoteBtn">Save Note</button>
      </div>
    </div>

    <!-- ── Summary Tab ── -->
    <div class="tab-panel" id="tab-summary">
      <div class="summary-scroll" id="summaryScroll">
        <div class="empty-hint" id="summaryEmpty">Generate a summary from your notes and Q&amp;A.</div>
        <div id="summaryBody" style="display:none"></div>
      </div>
      <div class="action-stack">
        <button class="btn-primary"   id="summarizeBtn">Summarize Meeting</button>
        <button class="btn-secondary" id="saveDriveBtn"  disabled>Save to Google Drive</button>
        <button class="btn-secondary" id="saveNotionBtn" disabled>Save to Notion</button>
      </div>
    </div>

    <!-- ── Settings Tab ── -->
    <div class="tab-panel" id="tab-settings">
      <div class="settings-scroll">
        <div class="field">
          <label>Anthropic API Key</label>
          <input type="password" id="anthropicKey" placeholder="sk-ant-…" autocomplete="off">
        </div>
        <div class="field">
          <label>Notion API Key</label>
          <input type="password" id="notionKey" placeholder="secret_…" autocomplete="off">
        </div>
        <div class="field">
          <label>Notion Database ID</label>
          <input type="text" id="notionDbId" placeholder="From Notion page URL">
        </div>
        <div class="field">
          <label>Google Doc ID <span class="label-note">(business context)</span></label>
          <input type="text" id="googleDocId" placeholder="1kuplZ6LnpuQC95U40d7XXvGVdcR-o_3lmuJCrs9Xikc">
          <div class="hint">Leave blank to use the default Prolific context doc.</div>
        </div>
        <div class="field">
          <div class="hint">Google Drive access uses your Chrome sign-in automatically — no token needed.</div>
        </div>
        <button class="btn-primary" id="saveSettingsBtn">Save Settings</button>
        <div class="settings-status" id="settingsStatus"></div>
      </div>
    </div>

  </div>

  <script src="sidebar.js"></script>
</body>
</html>
