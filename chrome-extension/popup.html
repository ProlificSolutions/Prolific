<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      width: 220px;
      padding: 16px;
      background: #050505;
      color: #ebe7df;
      font-family: 'Manrope', sans-serif;
      font-size: 12px;
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      letter-spacing: 2px;
      color: #c8ced8;
      margin-bottom: 6px;
    }
    p {
      color: rgba(235,231,223,0.5);
      font-size: 11px;
      line-height: 1.5;
      margin-bottom: 14px;
    }
    .status {
      font-size: 10px;
      color: rgba(235,231,223,0.4);
      margin-bottom: 12px;
      padding: 6px 8px;
      background: rgba(235,231,223,0.04);
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 9px;
      background: #c8ced8;
      color: #050505;
      border: none;
      border-radius: 6px;
      font-family: 'Orbitron', sans-serif;
      font-size: 9px;
      letter-spacing: 1px;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    .divider {
      border: none;
      border-top: 1px solid rgba(200,206,216,0.1);
      margin: 12px 0;
    }
    .check { color: #6ddb8e; margin-right: 4px; }
    .x     { color: #ff6b6b; margin-right: 4px; }
  </style>
</head>
<body>
  <h1>PROLIFIC AI</h1>
  <div class="status" id="status">Checking settings…</div>
  <p>Open a Google Meet call and click the <strong>◈</strong> button to open the sidebar.</p>
  <hr class="divider">
  <button id="settingsBtn">Open Settings</button>
  <script src="popup.js"></script>
</body>
</html>
